# cargo-mutants configuration, see https://mutants.rs/

# schema.rs is generated by diesel from the migrations, not hand-written code.
exclude_globs = ["src/schema.rs"]

# Drop the trivial error-plumbing mutants: the Display/Error/From impls only
# forward or format the inner error and are not worth asserting on. These
# patterns match whole impls, so if a From impl ever does more than wrap an
# error, narrow this.
exclude_re = [
    "impl .*Display for", # Display impls for the error enums
    "::fmt ->",           # fn fmt of those Display impls
    "::source ->",        # fn source of the std::error::Error impls
    "impl From<",         # From impls that only wrap an inner error
    # The batch size only decides how many rows go into one INSERT. Every row
    # is written either way, so no test can tell the difference.
    "replace >= with < in collect_statistics",
    # `written` only ever appears in the progress log line.
    "replace \\+= with \\*= in collect_statistics",
    # The `break` out of the input loop is an early exit only: both flags are
    # already final there, so continuing cannot change either counter. The
    # extra `take()` calls it would run only remove outpoints this transaction
    # spends itself, which no other transaction in the block can spend.
    "replace \\|\\| with && in TxStats::from_block",
    # Third arm of the low/high r/s else-if chain: the earlier arms leave only
    # one combination that reaches it, and there `&&` and `||` agree. The two
    # patterns below are pinned to a line, so re-check them with
    # `cargo mutants --list -f src/stats.rs` after edits above that line.
    "src/stats\\.rs:648:\\d+: replace && with \\|\\| in ScriptStats::from_block",
    # Fourth arm of that same chain, for the same reason.
    "src/stats\\.rs:650:\\d+: replace && with \\|\\| in ScriptStats::from_block",
]

# Run the unit tests and the fast integration tests. tests/minimal.rs is left
# out: it spawns a regtest bitcoind and takes minutes. New tests/*.rs files
# need to be added here to count for mutation testing.
additional_cargo_test_args = [
    "--lib",
    "--test", "cli",
    "--test", "db",
    "--test", "pipeline",
    "--test", "rest",
    "--test", "rest_pooling",
]

# The unit tests are a few seconds; allow 3x the baseline, but never time out
# below 60s so a loaded machine doesn't produce bogus timeouts.
timeout_multiplier = 3
minimum_test_timeout = 60

# Don't copy .git into every scratch build directory, it is not needed.
copy_vcs = false
